name: Test and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Test
        run: python -m pytest -q
      - name: Check frontend syntax
        run: |
          node --check dartabend/static/app.js
          node --check dartabend/static/integration.js
          node --check dartabend/static/turnier-blau.user.js
          node --check dartabend/static/turnier-rot.user.js
          node --check dartabend/static/turnier-schwarz.user.js
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify empty installation and container restart
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          trap 'docker logs turnierplaner-smoke; docker rm -f turnierplaner-smoke; docker volume rm turnierplaner-smoke-data' EXIT
          docker run -d --name turnierplaner-smoke -v turnierplaner-smoke-data:/data "$IMAGE"
          verify() {
            for attempt in $(seq 1 30); do
              if docker exec turnierplaner-smoke python -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/tournaments', timeout=2)); assert data==[]"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          verify
          docker restart turnierplaner-smoke
          verify
