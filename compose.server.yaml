version: "3.5"
services:
  turnierplaner:
    image: ghcr.io/mulich/dartfreunde-platten-turnierplaner:latest
    restart: unless-stopped
    environment:
      DARTPORTAL_URL: "${DARTPORTAL_URL:-http://192.168.178.137:18080}"
    ports:
      - "${TOURNAMENT_PORT:-18081}:8000"
    volumes:
      - tournaments:/data
    security_opt:
      - no-new-privileges:true
volumes:
  tournaments:
    name: dartfreunde-platten-turnierplaner-data
