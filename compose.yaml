services:
  turnierplaner:
    build: .
    restart: unless-stopped
    environment:
      TOURNAMENT_ADMIN_KEY: "${TOURNAMENT_ADMIN_KEY:-}"
    ports:
      - "${TOURNAMENT_PORT:-18081}:8000"
    volumes:
      - tournaments:/data
    security_opt:
      - no-new-privileges:true
volumes:
  tournaments:
